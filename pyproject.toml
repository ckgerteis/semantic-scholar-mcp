[project]
name = "semantic-scholar-mcp"
version = "2.0.1"
description = "MCP stdio server for the Semantic Scholar Academic Graph API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Christopher Gerteis", email = "christopher.gerteis@gmail.com" },
]
keywords = [
    "bibliographic-search",
    "bibliometrics",
    "citation-graph",
    "digital-humanities",
    "mcp",
    "model-context-protocol",
    "query-receipts",
    "scholarly-metadata",
    "semantic-scholar",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
semantic-scholar-mcp = "semantic_scholar_mcp:main"
semantic-scholar-mcp-ledger = "semantic_scholar_mcp.ledger:_cli"

[project.urls]
Homepage = "https://github.com/ckgerteis/semantic-scholar-mcp"
Repository = "https://github.com/ckgerteis/semantic-scholar-mcp"
Changelog = "https://github.com/ckgerteis/semantic-scholar-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/ckgerteis/semantic-scholar-mcp/issues"
Suite = "https://github.com/ckgerteis/bibliograph-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src layout: the wheel contains the package and nothing else.
#
# The flat layout this replaces installed `server.py` and `ledger.py` as
# *top-level* modules. Any two servers of this family in one environment
# therefore overwrote each other, and `pip check` reported nothing wrong — the
# later install simply won, silently, and the survivor answered under the wrong
# server's name. Namespacing under a package is what lets them coexist.
[tool.hatch.build.targets.wheel]
packages = ["src/semantic_scholar_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/CITATION.cff",
    "/CHANGELOG.md",
    "/install.ps1",
    "/install.py",
    "/mcpb",
    "/.env.example",
    "/response-schema.json",
    "/tests",
]
